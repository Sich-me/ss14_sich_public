- type: entity
  id: CrateEmergencyExplosive
  parent: CrateSecgear
  name: ящик з комплектом сапера
  description: Науковці збожеволіли? Щось вже пищить прямо за шлюзом вашого відділу? Купуйте зараз і станьте героєм, якого не заслужила, але потребує ця станція! (час в комплект не входить)
  components:
  - type: StorageFill
    contents:
      - id: ClothingHeadHelmetBombSuit
      - id: ClothingMaskGas
      - id: Screwdriver
      - id: Wirecutter
      - id: Multitool
      - id: ClothingOuterSuitBomb

- type: entity
  id: CrateEmergencyFire
  parent: CrateGenericSteel
  name: ящик з пожежним обладнанням
  description: Тільки ти можеш запобігти пожежам на станції. Використовуй ці два пожежних костюма, протигази, ліхтарики, велькі кисневі балони, вогнегасники та каски! Врятуй всіх пухнастих членів екіпажу.
  components:
  - type: StorageFill
    contents:
      - id: FlashlightLantern
        amount: 2
      - id: FireExtinguisher
        amount: 2
      - id: ClothingHeadHatHardhatRed
        amount: 2
      - id: ClothingMaskGas
        amount: 2
      - id: ClothingOuterSuitFire
        amount: 2
      - id: OxygenTankFilled
        amount: 2

- type: entity
  id: CrateEmergencyInternals
  parent: CrateInternals
  name: ящик з дихальним обладнанням
  description: Опануйте свою життєву енергію та контролюйте дихання за допомогою трьох дихальних масок, аварійних скафандрів та великих газових балонів. В комплекті присутній як азот, так й кисень.
  components:
  - type: StorageFill
    contents:
      - id: ClothingMaskGas
        amount: 3
      - id: ClothingMaskBreath
        amount: 3
      - id: OxygenTankFilled
        amount: 3
      - id: NitrogenTankFilled
        amount: 3
      - id: ClothingOuterSuitEmergency
        amount: 3

