  name: ящик з дихальним обладнанням (великий)
  description: Опануйте ще більше своєї життєвої енергії та контролюйте дихання за допомогою шістьох дихальних масок, аварійних скафандрів та великих газових балонів. В комплекті присутній як азот, так й кисень.
  components:
    - type: StorageFill
