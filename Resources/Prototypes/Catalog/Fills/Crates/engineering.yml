- type: entity
  id: CrateEngineeringCableLV
  parent: CrateElectrical
  name: ящик з кабелями НН
  description: Містить у собі 3 мотка кабелів низької напруги.
  components:
  - type: StorageFill
    contents:
      - id: CableApcStack
        amount: 3

- type: entity
  id: CrateEngineeringCableMV
  parent: CrateElectrical
  name: ящик з кабелями СН
  description: Містить у собі 3 мотка кабелів середньої напруги.
  components:
  - type: StorageFill
    contents:
      - id: CableMVStack
        amount: 3

- type: entity
  id: CrateEngineeringCableHV
  parent: CrateElectrical
  name: ящик з кабелями ВН
  description: Містить у собі 3 мотка кабелів високої напруги.
  components:
  - type: StorageFill
    contents:
      - id: CableHVStack
        amount: 3

- type: entity
  id: CrateEngineeringFoamGrenade
  parent: CrateEngineeringSecure
  name: ящик з герметиковими гранатами
  description: Містить у собі 5 гранат з металевою піною.
  components:
  - type: StorageFill
    contents:
    - id: MetalFoamGrenade
      amount: 5

- type: entity
  id: CrateEngineeringCableBulk
  parent: CrateElectrical
  name: оптовий ящик з кабелями
  description: Містить у собі по 2 мотка кожного типу кабеля.
  components:
  - type: StorageFill
    contents:
      - id: CableHVStack
        amount: 2
      - id: CableMVStack
        amount: 2
      - id: CableApcStack
        amount: 2

- type: entity
  id: CrateEngineeringElectricalSupplies
  parent: CrateElectrical
  name: ящик з спорядженням електрика
  description: Компанія Нанотрейзен не несе відповідальності за будь-які конфлікти з іншими членами екіпажу, пов'язані з ізольованими рукавичками, що входять до цього ящику.
  components:
  - type: StorageFill
    contents:
      - id: ToolboxElectricalFilled
        amount: 2
      - id: ClothingHandsGlovesColorYellow
        amount: 2

- type: entity
  id: CrateEngineeringStationBeaconBundle
  parent: CratePlastic
  name: комплект маяків станції
  description: Містить у собі 5 флетпаків маяків станції для додавання нових точок на мапу станції.
  components:
  - type: StorageFill
    contents:
    - id: StationBeaconPart
      amount: 5

- type: entity
  id: CrateEngineeringJetpack
  parent: CrateGenericSteel
  name: ящик з реактивними ранцями
  description: Містить у собі 2 реактивних ранця для тих, хто не вміє користуватися вогнегасниками.
  components:
  - type: StorageFill
    contents:
      - id: JetpackBlue
        amount: 2

- type: entity
  id: CrateEngineeringMiniJetpack
  parent: CrateGenericSteel
  name: ящик з міні реактивними ранцями
  description: Містить у собі 2 міні реактивних ранця для тих, хто не вміє користуватися вогнегасником, а також хоче більше труднощів.
  components:
  - type: StorageFill
    contents:
      - id: JetpackMini
        amount: 2

- type: entity
  id: CrateAirlockKit
  parent: CrateEngineering
  name: комплект для будівництва шлюзів
  description: Комплект для будівництва 6 шлюзів, інструменти в комплект не входять.
  components:
  - type: StorageFill
    contents:
      - id: SheetSteel
      - id: CableApcStack
      - id: DoorElectronics
        amount: 6

- type: entity
  id: CrateEvaKit
  parent: CrateCommandSecure
  name: комплект ЄВА
  description: Комплект, що складається з двох прекрасних костюмів з пінополіуретану та шоломів для них. Газові балони в комплетк не входять.
  components:
  - type: StorageFill
    contents:
      - id: ClothingHeadHelmetEVA
        amount: 2
      - id: ClothingOuterHardsuitEVA
        amount: 2

- type: entity
  id: CrateRCDAmmo
  parent: CrateEngineering
  name: ящик з стиснутою речовиною
  description: Містить у собі 3 картриджі зі стиснутою речовиною. Використовується ПШБ.
  components:
  - type: StorageFill
    contents:
    - id: RCDAmmo
      amount: 3

- type: entity
  id: CrateRCD
  parent: CrateEngineeringSecure
  name: ящик з ПШБ
  description: Містить у собі один Пристрій Швидкого Будівництва. Деякі кличуть цю штуковину РСД.
  components:
  - type: StorageFill
    contents:
    - id: RCD

- type: entity
  id: CrateParticleDecelerators
  parent: CrateEngineeringSecure
  name: ящик з сповільнювачами часток
  description: Містить у собі 3 Сповільнювача Часток. Не стриляйте їми в інших членів екіпажу!
  components:
  - type: StorageFill
    contents:
    - id: WeaponParticleDecelerator
      amount: 3

- type: entity
  id: CrateEngineeringSpaceHeater
  parent: CrateEngineering
  name: ящик з космічним обігрівачем
  description: Містить у собі космічний обігрівач для контролю клімату станції.
  components:
  - type: StorageFill
    contents:
      - id: SpaceHeaterFlatpack

- type: entityTable
  id: RandomTechBoardTable
  table: !type:GroupSelector
    children:
    - id: AirAlarmElectronics
    - id: FireAlarmElectronics
    - id: DoorElectronics
    - id: FirelockElectronics
    - id: APCElectronics
    - id: SignalTimerElectronics
    - id: SMESMachineCircuitboard
    - id: SubstationMachineCircuitboard
    - id: BorgChargerCircuitboard
    - id: CellRechargerCircuitboard
    - id: SpaceVillainArcadeComputerCircuitboard
    - id: BlockGameArcadeComputerCircuitboard

- type: entity
  id: CrateTechBoardRandom
  parent: ToteBase
  name: ящик з різноманітними платами
  description: Різномнітні плати, біс зна звідки вони.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: RandomTechBoardTable
        rolls: !type:RangeNumberSelector
          range: 6, 8

- type: entity
  id: CrateAirGrenade
  parent: CrateEngineering
  name: ящик з повітряними гранатами
  description: Містить у собі 3 повітряні гранати. Сподіваємося, ви їх замовляйте чисто для тестів.
  components:
  - type: StorageFill
    contents:
    - id: AirGrenade
      amount: 3
