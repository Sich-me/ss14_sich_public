  name: ящик з лампочками
  description: Нехай світло штучної Сатії осяє цю станцію! Або, принаймні, світло дванадцяти трубчасти ламп та стількох ж лампочок. Не давайте це ніанам, не впевнившись, що вони емоційно стабільні.
  components:
  - type: StorageFill
    contents:
      - id: BoxLighttube
      - id: BoxLightbulb

