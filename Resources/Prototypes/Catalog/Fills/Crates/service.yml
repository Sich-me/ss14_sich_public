- type: entity
  id: CrateServiceJanitorialSupplies
  parent: CratePlastic
  name: ящик з прибиральницьким приладдям
  description: Боріться з брудом та сміттям за допомогою набору "Базові Засоби Прибиральника Нанотрейзен™"! Містить три відра, знаки "мокра підлоги" та чинади. Також є швабра, спрей з очищувачем, дротяна щітка та сміттєвий пакет. "НЕ ХОДИТИ ПО ПОМИТОМУ!!!"
  components:
  - type: StorageFill
    contents:
      - id: MopItem
      - id: MopBucketCubeWrapped
      - id: Bucket
        amount: 3
      - id: WetFloorSign
        amount: 2
      - id: Soap
      - id: SprayBottleSpaceCleaner
        amount: 2
      - id: TrashBag
        amount: 2
      - id: Plunger
        amount: 2
      - id: BoxCleanerGrenades
      - id: WireBrush
        amount: 2

- type: entity
