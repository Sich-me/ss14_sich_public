- type: entity
  id: PartIPC
  parent: [BaseItem, BasePart]
  name: "частина тіла ІПШ"
  abstract: true
  components:
    - type: Sprite
      sprite: _Sich/Mobs/Species/IPCs/parts.rsi
    - type: Damageable
      damageContainer: Biological
    - type: BodyPart
    - type: ContainerContainer
      containers:
        bodypart: !type:Container
          ents: []
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Iron
          Quantity: 10
        - ReagentId: Oil
          Quantity: 20

- type: entity
  id: HeadIPC
  name: "голова ІПШ"
  parent: [PartIPC, BaseHead]
  components:
    - type: Sprite
      state: "head"
      sprite: _Sich/Mobs/Species/IPCs/parts.rsi
    - type: Icon
      state: "head"
      sprite: _Sich/Mobs/Species/IPCs/parts.rsi
    - type: BodyPart
      partType: Head
      vital: true
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Iron
          Quantity: 5
        - ReagentId: Oil
          Quantity: 10

