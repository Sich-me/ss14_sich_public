- type: markingsGroup
  parent: Undergarments
  id: IPC
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
      default: [ IPCChassisHead ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIPC
  name: IPC appearance
  components:
  - type: Inventory
    speciesId: IPC
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganIPCTorso
      Head: OrganIPCHead
      ArmLeft: OrganIPCArmLeft
      ArmRight: OrganIPCArmRight
      HandRight: OrganIPCHandRight
      HandLeft: OrganIPCHandLeft
      LegLeft: OrganIPCLegLeft
      LegRight: OrganIPCLegRight
      FootLeft: OrganIPCFootLeft
      FootRight: OrganIPCFootRight
      Brain: OrganIPCBrain
  - type: HumanoidProfile
    species: IPC

- type: entity
  parent: [ AppearanceIPC, BaseSpeciesMob, MobFlammable]
  id: MobIPC
  name: Urist McBot
  components:
  - type: Respirator # цей компонент це один великий workaround щоб тест не сварився 
    damage:
      types:
        Asphyxiation: 0
    damageRecovery:
      types:
        Asphyxiation: 0
    minSaturation: 0         
    suffocationThreshold: -1 # "сатурація" ніколи не буде нижча за -1, тому іпш ніколи не почне "задихатись"
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
  - type: Icon
    sprite: _Sich/Mobs/Species/IPC/parts.rsi
    state: full
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: Steel
      amount: 3
  - type: Speech
    speechSounds: IPC
  - type: TypingIndicator
    proto: robot
  - type: Vocal
    sounds:
      Male: MaleIPC
      Female: FemaleIPC
      Unsexed: UnisexIPC
    wilhelm:
      path: /Audio/_Sich/Voice/IPC/wilhelm.ogg
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Robotic
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#171624"
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 300
    bloodlossDamage:
      types:
        Heat: 0.25
    bloodlossHealDamage:
      types:
        Heat: -0.5
  - type: ZombieImmune
  - type: Repairable
    damageValue: -10 # 10 seconds to repair from crit
    doAfterDelay: 1
    fuelCost: 0.5
    allowSelfRepair: true
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.6
      90: 0.4
  - type: TemperatureDamage
    heatDamageThreshold: 452.875 # melting point of iron 1/4th, cause fuck physics you know #erm actualy there is not only iron also other things that has lower melting temperature
    coldDamageThreshold: 283.15 # 10c aka "cold" causes condensation/freezing and as such shorting
    coldDamage:
      types:
        Cold: 1
        Heat: -2
    heatDamage:
      types:
        Heat: 2
        Cold: -1
  - type: Temperature
    currentTemperature: 313.15
    specificHeat: 46
  - type: Flammable
    damage:
      types:
        Heat: 1.2
  - type: FireVisuals
    alternateState: Standing
  - type: StunVisuals
  - type: TemperatureSpeed #Сповільнення від температури
    thresholds: #(стокове +10, у ніан +5 від цих значень)
      283: 0.9
      270: 0.75
      245: 0.5
  - type: ThermalRegulator #типу охолодження від сиситеми охолодження
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 300.15
    thermalRegulationTemperatureThreshold: 2
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  
- type: entity
  parent: OrganBase
  id: OrganIPC
  abstract: true
  suffix: IPC

- type: entity
  id: OrganIPCMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    updateInterval: 1.5
    maxReagents: 2
    metabolizerTypes: [IPC]
    removeEmpty: true

- type: entity
