- type: entity
  save: false
  name: Urist McBot
  parent: [BaseMobSpecies, MobFlammable]
  id: BaseMobIPC
  abstract: true
  components:
  - type: Respirator # цей компонент це один великий workaround щоб тест не сварився 
    damage:
      types:
        Asphyxiation: 0
    damageRecovery:
      types:
        Asphyxiation: 0
    minSaturation: 0         
    suffocationThreshold: -1 # "сатурація" ніколи не буде нижча за -1, тому іпш ніколи не почне "задихатись"
  # The important nessessities
  - type: MovementSpeedModifier
  - type: Body
    prototype: IPC
    requiredLegs: 2
  - type: HumanoidAppearance
    species: IPC
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Robotic
  - type: Icon
    sprite: _Sich/Mobs/Species/IPCs/parts.rsi
    state: full
  # Damage and speed
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 300
    bloodlossDamage:
      types:
        Heat: 0.25
    bloodlossHealDamage:
      types:
        Heat: -0.5
  - type: TemperatureDamage
    heatDamageThreshold: 452.875 # melting point of iron 1/4th, cause fuck physics you know #erm actualy there is not only iron also other things that has lower melting temperature
    coldDamageThreshold: 283.15 # 10c aka "cold" causes condensation/freezing and as such shorting
    coldDamage:
      types:
        Cold: 1
        Heat: -2
    heatDamage:
      types:
        Heat: 2
        Cold: -1
  - type: Temperature
    currentTemperature: 313.15
    specificHeat: 46
  - type: ZombieImmune
  - type: Repairable
    damageValue: -10 # 10 seconds to repair from crit
    doAfterDelay: 1
    fuelCost: 0.5
    allowSelfRepair: true
  - type: Barotrauma
    damage:
      types:
        Heat: 1
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.6
      90: 0.4
  - type: ThermalRegulator #типу охолодження від сиситеми охолодження
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 300.15
    thermalRegulationTemperatureThreshold: 2
  - type: Flammable
    damage:
      types:
        Heat: 1.2
  - type: FireVisuals
    alternateState: Standing
  - type: StunVisuals
  # Misc
  - type: Speech
    speechSounds: IPC
  - type: Vocal
    sounds:
      Male: MaleIPC
      Female: FemaleIPC
      Unsexed: UnisexIPC
    wilhelm:
      path: /Audio/_Sich/Voice/IPC/wilhelm.ogg
    wilhelmProbability: 0.001
  - type: TypingIndicator
    proto: robot
  - type: Inventory
    templateId: ipc

- type: entity
  name: Urist McBot
  parent: BaseSpeciesDummy
  id: MobIPCDummy
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Inventory
    templateId: ipc
  - type: HumanoidAppearance
    species: IPC
