- type: entity
  parent: WeaponTetherGun
  id: SichPoltergeistWeaponTetherGun
  name: містичний контроль
  description: ти можеш за допомогою цього переміщювати об'єкти
  suffix: полтергейст
  components:
    - type: TetherGun
      maxForce: 10000
      massLimit: 10000
      dampingRatio: 4
      frequency: 20

- type: entity
  parent: WeaponForceGun
  id: SichPoltergeistWeaponForceGun
  name: містичний сила
  description: ти можеш за допомогою цього кидати об'єкти
  suffix: полтергейст
  components:
    - type: ForceGun
      maxForce: 1000
      massLimit: 10000
      frequency: 15
      dampingRatio: 4
      throwForce: 50
      throwDistance: 100
      lineColor: "#18a2d5"
      soundLaunch:
        path: /Audio/Weapons/soup.ogg
        params:
          volume: 2
    - type: Sprite
      sprite: _Sich/Objects/Weapons/Guns/Launchers/poltergeist_throw_force.rsi
      layers:
        - state: base
        - state: base-unshaded
          map: [ "unshaded" ]
          shader: unshaded
          visible: false