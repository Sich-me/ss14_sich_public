- type: entity
  id: BureaucracyComputer
  name: "Bureaucracy Computer"
  description: "A computer used for bureaucratic"
  parent: BaseComputerAiAccess
  components:
  - type: BureaucracyComputer
  - type: UserInterface
    interfaces:
      enum.Content.Shared.Sich.BureaucraticComputer.BureaucracyUiKey.Key:
        type: BureaucracyComputerBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: alert-0
    - map: ["computerLayerKeys"]
      state: atmos_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }


- type: bureaucraticDocument
  id: testDocument
  name: "Test Document"
  text: "This is a test document for the Bureaucracy Computer. [field=Test Field]"

