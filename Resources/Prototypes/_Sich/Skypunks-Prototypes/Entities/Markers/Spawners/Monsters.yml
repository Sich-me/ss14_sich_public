- type: entity
  name: Кабан спавнер
  id: SichSkypunkMobBoarSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: _Sich/SkypunkTextures/Mobs/Monsters/boar.rsi
    layers:
      - state: alive
  - type: ConditionalSpawner
    prototypes:
      - SichSkypunkMobBoar

- type: entity
  name: Часовий спавнер кабана
  id: SichSkypunkMobBoarTimedSpawner
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: blue
        - sprite: _Sich/SkypunkTextures/Mobs/Monsters/boar.rsi
          state: alive
        - state: timed
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - SichSkypunkMobBoar
      chance: 0.85
      intervalSeconds: 1800
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 1